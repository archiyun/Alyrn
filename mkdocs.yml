site_name: CoroPact
site_description: C++23 coroutine networking runtime documentation
site_url: https://archiyun.github.io/CoroPact/
repo_url: https://github.com/archiyun/CoroPact
repo_name: archiyun/CoroPact

theme:
    name: material
    language: zh
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.indexes
        - navigation.top
        - search.suggest
        - search.highlight
        - content.code.copy

markdown_extensions:
    - admonition
    - attr_list
    - md_in_html
    - toc:
          permalink: true
    - pymdownx.details
    - pymdownx.highlight
    - pymdownx.superfences

nav:
    - 首页: index.md
    - 设计:
          - 网络库: design/zh-CN/network/index.md
          - 数据结构: design/zh-CN/datastructure/index.md
    - 基准:
          - 网络库统一 HTTP 压测: benchmark/network-libraries.md
          - luring 与 Reactor 对比: benchmark/luring-reactor-comparison-20260802.md
