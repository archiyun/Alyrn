site_name: Alyrn
site_description: C++23 coroutine networking runtime documentation
site_url: https://archiyun.github.io/Alyrn/
repo_url: https://github.com/archiyun/Alyrn
repo_name: archiyun/Alyrn

theme:
    name: material
    language: zh
    font:
        text: Noto Sans SC
        code: JetBrains Mono
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          toggle:
              icon: material/weather-sunny
              name: 切换到深色模式
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          toggle:
              icon: material/weather-night
              name: 切换到浅色模式
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.indexes
        - navigation.top
        - navigation.footer
        - navigation.tracking
        - search.suggest
        - search.highlight
        - search.share
        - content.code.copy
        - content.code.annotate
        - toc.follow

extra_css:
    - stylesheets/extra.css

markdown_extensions:
    - admonition
    - attr_list
    - md_in_html
    - toc:
          permalink: true
    - pymdownx.details
    - pymdownx.highlight
    - pymdownx.superfences

nav:
    - 开始:
          - 概览: index.md
          - 子系统边界: SUBSYSTEMS.md
          - C++ 书写规范: coding-style.md
          - 构建与安装: packaging.md
          - Runtime Builder: design/zh-CN/network/runtime-builder.md
    - 架构:
          - 协程与调度:
                - 协程分层: adr/0008-coroutine-layering.md
                - 后端无关 I/O contract: adr/0009-backend-neutral-io-contract.md
                - Runtime 组合根: adr/0010-runtime-composition-root.md
          - 网络语义:
                - 概览: design/zh-CN/network/index.md
                - 生命周期精化协程 I/O: design/zh-CN/network/lifecycle-refined-coroutine-io.md
                - AsyncStream / AsyncListener 契约: design/zh-CN/network/async-stream-contract.md
                - Recv：所有权转移接收: design/zh-CN/network/recv.md
                - AcceptSource 契约: design/zh-CN/network/accept-source-contract.md
          - 形式模型:
                - 阅读指南: design/zh-CN/network/formal/index.md
    - 后端:
          - Epoll:
                - 概览: design/zh-CN/network/epoll/index.md
                - Loop、readiness 与取消/关闭: design/zh-CN/network/epoll/loop-and-cancellation.md
          - luring / io_uring:
                - 概览: design/zh-CN/network/luring/index.md
                - operation 生命周期: design/zh-CN/network/luring/operation-lifecycle.md
                - loop、ring 与 worker: design/zh-CN/network/luring/loop-and-workers.md
                - stream 操作: design/zh-CN/network/luring/stream.md
                - listener 与 AcceptSource: design/zh-CN/network/luring/listener-and-accept.md
                - multishot recv 与 provided buffer: design/zh-CN/network/luring/recv-source.md
                - SendZeroCopy: design/zh-CN/network/luring/zero-copy-send.md
                - timer、超时与停止: design/zh-CN/network/luring/timers-and-timeouts.md
                - 注册资源的边界: design/zh-CN/network/luring/registered-resources.md
                - 跨 worker mailbox: design/zh-CN/network/luring/cross-worker-mailbox.md
                - operation 语义矩阵: design/zh-CN/network/luring-operation-matrix.md
    - 基础模块:
          - 数据结构:
                - 概览: design/zh-CN/datastructure/index.md
                - Intrusive 模型与契约: design/zh-CN/datastructure/intrusive-model.md
          - ADR:
                - intrusive rbtree timer: adr/0001-intrusive-rbtree-timer.md
                - timer index strategy: adr/0011-timer-index-strategy.md
    - 验证与发布:
          - 基准:
                - 2026-08-10 C++ 网络库基线: benchmark/network-libraries-20260810.md
                - 网络库统一 HTTP 压测: benchmark/network-libraries.md
                - luring 与 Epoll 对比: benchmark/luring-epoll-comparison-20260802.md
          - 发布记录:
                - v0.1.0: releases/v0.1.0.md
